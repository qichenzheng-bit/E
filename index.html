<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>青岛个人旅行打卡册 · 设计导出版</title>
<style>
*{box-sizing:border-box}
:root{--navy:#14354d;--blue:#0b78c7;--light:#f4f8fb;--paper:#fffdf8;--line:#e3edf3;--muted:#61788a;--card:#ffffff}
body{margin:0;background:linear-gradient(#dff3ff,#f4f8fb 260px);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--navy)}
.app{max-width:760px;margin:auto;padding:14px 13px 100px}
.hero{background:linear-gradient(135deg,#0677c8,#31b6d1);color:#fff;border-radius:25px;padding:22px 18px;box-shadow:0 12px 34px #0878c933;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:170px;height:170px;border-radius:50%;background:#ffffff22}
.hero small{font-weight:900;letter-spacing:2px} .hero h1{font-size:30px;margin:5px 0} .hero p{margin:0;opacity:.94}
.top-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.top-actions button{border:0;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}
.primary{background:#fff;color:#0b78c7} .ghost{background:#ffffff22;color:#fff;border:1px solid #ffffff44}
.bar{height:10px;background:#ffffff4c;border-radius:20px;overflow:hidden;margin-top:14px} .bar i{display:block;height:100%;width:0;background:white} .prog{font-size:12px;font-weight:800;margin-top:6px;text-align:right}
.tabs{display:flex;gap:7px;position:sticky;top:0;z-index:10;padding:10px 0;background:linear-gradient(#f4f8fbdd,#f4f8fb00)} .tabs button{flex:1;border:0;border-radius:13px;padding:11px;background:#fff;font-weight:900;color:#557083} .tabs .on{background:#123f62;color:#fff}
.intro{background:#fff;border-radius:17px;padding:13px;font-size:13px;line-height:1.6;color:#5c7385;border:1px solid #e6eef3}
.day{font-size:13px;font-weight:900;letter-spacing:1px;color:#6b8494;margin:18px 4px 8px}
.card{background:#fff;border:1px solid #e5eef3;border-radius:22px;padding:16px;margin:10px 0;box-shadow:0 8px 24px #173b4f0c}
.top{display:flex;justify-content:space-between;gap:10px} .time{font-size:12px;color:#0b79c7;font-weight:900} h2{font-size:21px;margin:4px 0 2px} .tag{font-size:13px;color:#72899a}
.status{font-size:11px;font-weight:900;background:#eef4f7;color:#78909f;border-radius:9px;padding:6px 8px;height:max-content} .status.ok{background:#e5f8ef;color:#07835c}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0} .btn{border:0;border-radius:13px;padding:12px 8px;font-size:14px;font-weight:900;text-align:center;text-decoration:none} .nav{background:#e9f5ff;color:#0b79c7} .arr{background:#173f5d;color:#fff}
.shothead{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin:12px 1px 8px} .count{font-size:12px;background:#fff1e2;color:#c66a16;border-radius:20px;padding:5px 9px}
.grid{display:grid;grid-template-columns:1fr;gap:8px} .slot{position:relative;min-height:200px;background:#f7fafc;border:1px solid #e2ebf0;border-radius:15px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;cursor:pointer} .slot input{display:none} .slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover} .num{position:absolute;top:7px;left:7px;background:#173f5d;color:#fff;border-radius:8px;padding:4px 7px;font-size:11px;font-weight:900;z-index:2} .prompt{font-size:12px;line-height:1.35;color:#637c8d;padding-top:18px;z-index:2} .slot.has:after{content:"";position:absolute;left:0;right:0;bottom:0;height:54%;background:linear-gradient(transparent,#000b)} .slot.has .prompt{position:absolute;left:7px;right:7px;bottom:7px;color:white;font-weight:800;text-align:left} .slot::before{content:"相册 / 拍照";position:absolute;right:8px;top:8px;background:#ffffffd9;color:#0677c8;border-radius:9px;padding:4px 7px;font-size:10px;font-weight:900;z-index:2} .slot.has::before{display:none}
.addphoto{width:100%;border:1px dashed #8fc7e8;border-radius:14px;background:#f2faff;color:#0878c9;padding:12px;font-weight:900;margin-top:8px;cursor:pointer} .addphoto[hidden]{display:none}
.copybox{margin-top:14px;background:linear-gradient(135deg,#eff9ff,#fff8f2);border:1px solid #dcebf3;border-radius:17px;padding:13px}.capedit{width:100%;min-height:180px;border:1px solid #d8e7ef;border-radius:12px;background:#ffffffcc;padding:12px;font:inherit;font-size:14px;line-height:1.75;color:#294c64;resize:vertical}.captools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.captools button{border:0;border-radius:11px;padding:10px;font-weight:900}.restorecap{background:#f2f5f7;color:#687f90}.copycap{background:#e7f5ff;color:#0677c8} .ct{font-size:13px;font-weight:900;color:#0b79c7;margin-bottom:7px} .cap{white-space:pre-wrap;font-size:14px;line-height:1.75;color:#294c64}
.note{width:100%;border:1px solid #dfe9ee;border-radius:12px;min-height:66px;padding:10px;margin-top:10px;font:inherit} .donebtn{width:100%;border:0;border-radius:13px;background:#e5f8ef;color:#087c5c;padding:12px;font-weight:900;margin-top:9px} .donebtn.on{background:#087c5c;color:#fff}
.ex-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px} .expbtn{border:0;border-radius:12px;padding:11px;font-weight:900;cursor:pointer} .outline{background:#f6fbff;color:#0b79c7;border:1px solid #dbeffc} .sand{background:#fff5e8;color:#bc6b1d}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid #deeaef;padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:20} .bottom div{max-width:760px;margin:auto;display:flex;gap:8px} .bottom button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:900} .next{background:#0b79c7;color:#fff} .teamBtn{background:#eef3f6;color:#60798a}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#16394eef;color:#fff;border-radius:12px;padding:10px 13px;font-size:13px;font-weight:800;opacity:0;transition:.2s;z-index:99} .toast.show{opacity:1}
/* Export modal */
.modal{display:none;position:fixed;inset:0;background:#10293bcc;z-index:200;align-items:center;justify-content:center;padding:14px} .modal.show{display:flex} .modalbox{width:min(96vw,860px);max-height:94vh;background:#fff;border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px} .modalhead{display:flex;align-items:center;justify-content:space-between;gap:8px} .modalhead h3{margin:0;font-size:18px} .modalactions{display:flex;gap:8px} .modalactions button{border:0;border-radius:10px;padding:10px 12px;font-weight:900}
#posterViewport{flex:1;overflow:auto;background:#edf5fa;border-radius:18px;padding:14px;display:flex;justify-content:center;align-items:flex-start}
/* Poster styles */
.poster{width:680px;background:var(--paper);border-radius:28px;box-shadow:0 20px 60px rgba(22,57,78,.15);padding:22px;position:relative;overflow:hidden;color:#13344a}
.poster .sheet{position:relative;z-index:2}
.poster .title-cn{font-size:54px;line-height:1.08;font-weight:900;letter-spacing:1px;font-family:"STKaiti","KaiTi","PingFang SC",serif}
.poster .title-en{font-size:26px;font-style:italic;opacity:.7;margin-left:8px}
.poster .sub{font-size:28px;margin-top:8px;font-family:"STKaiti","KaiTi","PingFang SC",serif}
.poster .loc{margin-top:12px;font-size:22px;font-weight:700}
.poster .desc{margin-top:18px;font-size:30px;line-height:1.65;font-family:"STKaiti","KaiTi","PingFang SC",serif}
.poster .camera-doodle,.poster .ship-doodle,.poster .sun-doodle,.poster .book-doodle,.poster .flower-doodle,.poster .mountain-doodle,.poster .lighthouse-doodle{position:absolute;z-index:1;opacity:.9}
.poster .camera-doodle{right:24px;bottom:28px;font-size:44px} .poster .ship-doodle{right:28px;bottom:18px;font-size:54px} .poster .sun-doodle{right:24px;top:26px;font-size:42px} .poster .book-doodle{left:26px;bottom:24px;font-size:40px} .poster .flower-doodle{left:18px;top:18px;font-size:36px} .poster .mountain-doodle{right:18px;top:16px;font-size:44px} .poster .lighthouse-doodle{right:22px;bottom:18px;font-size:50px}
.poster .wave{position:absolute;left:-20px;right:-20px;bottom:0;height:72px;background:radial-gradient(circle at 40px -6px, transparent 36px, #8bd3ff 37px, #8bd3ff 40px, transparent 41px) repeat-x;background-size:84px 72px;opacity:.45}
.poster .leaf-corner::before,.poster .leaf-corner::after{content:"🍃";position:absolute;font-size:44px} .poster .leaf-corner::before{right:16px;top:14px} .poster .leaf-corner::after{left:18px;bottom:14px}
.poster .floral-corner::before,.poster .floral-corner::after{content:"🌸";position:absolute;font-size:44px} .poster .floral-corner::before{left:16px;top:12px} .poster .floral-corner::after{right:16px;bottom:12px}
.poster .skyline{position:absolute;right:16px;top:20px;font-size:46px;opacity:.45}
.poster .mountain-bg{position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(#caeafc,#f8fcff);clip-path:polygon(0 80%,10% 55%,20% 75%,31% 45%,42% 76%,53% 50%,64% 70%,76% 35%,87% 68%,100% 40%,100% 0,0 0);opacity:.65}
.poster .photo-hero{margin-top:16px;border-radius:14px;overflow:hidden;background:#e8eef3;border:9px solid rgba(255,255,255,.85);box-shadow:0 7px 24px rgba(0,0,0,.08)} .poster .photo-hero img{display:block;width:100%;height:270px;object-fit:cover}
.poster .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px} .poster .thumb{position:relative;border-radius:10px;overflow:hidden;background:#e8eef3;border:6px solid rgba(255,255,255,.9);box-shadow:0 4px 15px rgba(0,0,0,.06)} .poster .thumb img{display:block;width:100%;height:138px;object-fit:cover} .poster .thumb.more::after{content:attr(data-more);position:absolute;inset:0;background:#0007;color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900}
.poster .badge{position:absolute;right:24px;top:24px;background:#fff6d8;color:#bd7b13;border-radius:999px;padding:8px 14px;font-size:18px;font-weight:900;border:1px solid #f3e5a8}
.poster .polaroid-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px} .poster .polaroid{background:#fff;border-radius:8px;padding:8px 8px 16px;box-shadow:0 8px 22px rgba(0,0,0,.08);transform:rotate(var(--r));} .poster .polaroid img{display:block;width:100%;height:104px;object-fit:cover;border-radius:4px} .poster .polaroid .plabel{text-align:center;margin-top:8px;font-size:20px;font-weight:800;font-family:"STKaiti","KaiTi","PingFang SC",serif}
.poster .summary-text{margin-top:18px;font-size:30px;line-height:1.6;font-family:"STKaiti","KaiTi","PingFang SC",serif}
.poster .date{position:absolute;right:22px;top:18px;font-size:18px;font-weight:800}
.theme-dawn{background:linear-gradient(180deg,#eef9ff,#fffdf7)}
.theme-leaf{background:linear-gradient(180deg,#f8fff3,#fffdf7)}
.theme-sky{background:linear-gradient(180deg,#eaf6ff,#fffdf7)}
.theme-rock{background:linear-gradient(180deg,#eef8ff,#fffdf7)}
.theme-flower{background:linear-gradient(180deg,#fff9f4,#fffdf7)}
.theme-sunset{background:linear-gradient(180deg,#fff5ef,#fffdf7)}
.theme-mountain{background:linear-gradient(180deg,#edf7ff,#fffdf7)}
.theme-city{background:linear-gradient(180deg,#f3fbff,#fffdf7)}
.theme-summary{background:linear-gradient(180deg,#f6fbff,#fffdf7)}
@media (max-width:760px){ .poster{width:100%;padding:18px} .poster .title-cn{font-size:42px} .poster .sub{font-size:23px} .poster .desc,.poster .summary-text{font-size:24px} .poster .loc{font-size:18px} .poster .polaroid-grid{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <small>QINGDAO · SOLO SCRAPBOOK</small>
    <h1>青岛个人旅行打卡册</h1>
    <p>逐张上传照片 · 每站可导出设计稿 · 最后可导出整体打卡图</p>
    <div class="top-actions">
      <button class="primary" onclick="exportOverall()">🖼 导出整体打卡图</button>
      <button class="ghost" onclick="scrollToFirstUnfinished()">📍 去下一个未完成地点</button>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="prog" id="prog">0 / 13</div>
  </section>
  <div class="tabs"><button class="on" onclick="filterDay(0,this)">全部</button><button onclick="filterDay(1,this)">DAY 1</button><button onclick="filterDay(2,this)">DAY 2</button></div>
  <div class="intro"><b>说明：</b>本版已接入“设计导出”功能。每个景点上传的照片会自动填入对应的海报版式；每个景点都能单独导出，全部打卡后也能导出一个整体打卡图。网站更新会优先沿用同一份本地数据。</div>
  <div id="list"></div>
</div>
<div class="bottom"><div><button class="teamBtn" onclick="resetAll()">重置</button><button class="next" onclick="nextStop()">下一个未完成地点 →</button></div></div>
<div id="toast" class="toast"></div>

<div id="exportModal" class="modal">
  <div class="modalbox">
    <div class="modalhead">
      <h3 id="modalTitle">导出打卡图</h3>
      <div class="modalactions">
        <button class="outline" onclick="downloadPoster()">下载图片</button>
        <button class="sand" onclick="closeExportModal()">关闭</button>
      </div>
    </div>
    <div id="posterViewport"><div id="posterPreview"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const S=[{"day": 1, "time": "05:20–06:10", "name": "八大峡 / 西陵峡路", "tag": "日出 · 第一站", "nav": "八大峡广场 青岛", "shots": ["海面日出大远景", "太阳刚露出海面的瞬间", "人物全身＋日出", "人物半身侧脸＋晨光", "背影看海", "海浪／礁石细节", "沿海边走路抓拍", "竖屏人物＋太阳", "横屏海岸全景", "离开前合影"], "caption": "青岛的第一站，从一场海边日出开始。\n\n天还没有完全亮，海风先到了。看着天色从蓝灰一点点染成橙红，太阳从海面升起，旅行也在这一刻正式开始。\n\n📍青岛 · 八大峡 / 西陵峡路\n🌅 把今天的第一束光，留在海边。\n\n#青岛旅行 #青岛日出 #八大峡 #西陵峡路"}, {"day": 1, "time": "08:30–09:45", "name": "流清河沙滩", "tag": "免费崂山 · 山海同框", "nav": "流清河沙滩 青岛", "shots": ["山＋海大远景", "沙滩完整环境", "人物全身＋山海", "人物半身＋海风", "背影走向海边", "海浪／沙纹细节", "踩水抓拍", "竖屏山海人物", "横屏海岸大片", "山海合影"], "caption": "不爬崂山，也能看见崂山最舒服的一面。\n\n山就在身后，海就在眼前。没有赶路，也没有打卡式登山，只是在流清河的沙滩上慢慢走，把山、海和风一起装进照片里。\n\n📍青岛 · 流清河沙滩\n⛰️ 山海相逢，自有答案。\n\n#崂山 #流清河 #青岛海边 #山海之间"}, {"day": 1, "time": "09:45–10:45", "name": "东麦窑", "tag": "渔村 · 红瓦 · 山脚", "nav": "东麦窑社区 青岛", "shots": ["村落＋山体全景", "红瓦房屋特写", "人物全身＋村路", "人物半身＋老屋", "背影走进村里", "石墙／门牌细节", "街巷自然抓拍", "竖屏红瓦层次", "横屏村落＋海", "生活感小角落"], "caption": "从海滩走进崂山脚下的小渔村。\n\n红瓦、石墙、老屋和远处的山海都挤进一幅画里。这里没有热门景点的喧闹，更像是偶然走进了青岛安静的日常。\n\n📍青岛 · 东麦窑\n🏘️ 山脚有村，村外有海。\n\n#东麦窑 #崂山渔村 #青岛旅行 #山海渔村"}, {"day": 1, "time": "11:20–12:30", "name": "沙子口", "tag": "海湾 · 渔船 · 午间", "nav": "沙子口 青岛", "shots": ["海湾全景", "渔船／港湾", "人物全身＋海湾", "人物半身", "背影看海", "船只／码头细节", "沿岸走路抓拍", "竖屏港湾", "横屏海湾", "午饭／本地小吃"], "caption": "上午的山海路线，在沙子口慢下来。\n\n海湾、渔船和岸边的生活气息，让这里不像一个必须完成的景点，更像一段刚刚好的停顿。看一会儿海，再认真吃顿午饭。\n\n📍青岛 · 沙子口\n⛵ 海风经过，时间也慢一点。\n\n#沙子口 #青岛海湾 #青岛旅行 #慢旅行"}, {"day": 1, "time": "13:40–14:20", "name": "海之恋公园", "tag": "海岸公园 · 轻松散步", "nav": "海之恋公园 青岛", "shots": ["公园海岸大景", "标志景观", "人物全身＋海岸", "人物半身", "背影看海", "栏杆／植物细节", "散步抓拍", "竖屏海边人像", "横屏海景", "坐着休息"], "caption": "下午不赶路，只在海边慢慢走。\n\n旅行里最舒服的时刻，往往不是完成了多少景点，而是刚好有一段时间，可以吹风、看海、什么都不用想。\n\n📍青岛 · 海之恋公园\n💙 把下午留给海风。\n\n#海之恋公园 #青岛海边 #松弛感"}, {"day": 1, "time": "14:40–16:40", "name": "小麦岛", "tag": "草地 · 海景 · 第一日收尾", "nav": "小麦岛公园 青岛", "shots": ["小麦岛海岸全景", "草地＋海", "人物全身＋草地", "人物半身＋海风", "背影坐草地", "海浪／礁石", "沿海步道抓拍", "竖屏人物海景", "横屏岛屿海岸", "当天最喜欢的一张"], "caption": "第一天最后一站，留给小麦岛。\n\n坐在草地上吹风，看海面一点点变柔，不再赶时间，也不用刻意安排什么。青岛的浪漫，大概就是把一天结束在这样松弛的海边。\n\n📍青岛 · 小麦岛\n🌿 今日份浪漫，到海边刚刚好。\n\n#小麦岛 #青岛旅行 #海边草地 #松弛旅行"}, {"day": 2, "time": "08:00–08:45", "name": "信号山", "tag": "红瓦 · 绿树 · 老城全景", "nav": "信号山公园 青岛", "shots": ["老城＋海全景", "红瓦屋顶层次", "人物全身＋城市", "人物半身＋栏杆", "背影俯瞰老城", "观景台细节", "上山抓拍", "竖屏红瓦人像", "横屏城市全景", "最高处纪念照"], "caption": "第二天，从老城的高处开始。\n\n红瓦、绿树、老建筑和远处的海，在信号山上一层层铺开。站在这里，才真正明白为什么青岛的颜色这么特别。\n\n📍青岛 · 信号山\n🏙️ 一眼看见青岛的红瓦与海。\n\n#信号山 #青岛老城 #红瓦绿树 #青岛旅行"}, {"day": 2, "time": "08:50–09:30", "name": "小鱼山", "tag": "老城 · 海岸 · 另一种视角", "nav": "小鱼山公园 青岛", "shots": ["观景台全景", "老城＋海同框", "人物全身＋景色", "人物半身", "背影观景", "亭台建筑细节", "观景台抓拍", "竖屏城市层次", "横屏老城海岸", "特色建筑合影"], "caption": "换一个角度，再看一次青岛老城。\n\n小鱼山不高，却刚好能把屋顶、树影、海岸和城市一起收进眼里。比起宏大的风景，这里更像一张精致的青岛明信片。\n\n📍青岛 · 小鱼山\n🐟 山不高，风景刚刚好。\n\n#小鱼山 #青岛老城 #青岛旅行 #城市风景"}, {"day": 2, "time": "09:35–10:50", "name": "鲁迅公园 + 琴屿路", "tag": "礁石 · 海浪 · 滨海步行", "nav": "琴屿路 青岛", "shots": ["礁石海岸大景", "琴屿路路牌／街景", "人物全身＋海", "人物半身＋树影", "背影沿海走", "海浪拍礁石", "走路自然抓拍", "竖屏街海构图", "横屏海岸大片", "咖啡／休息"], "caption": "沿着鲁迅公园走到琴屿路，海一直在身边。\n\n礁石、树影、海浪和老城气息混在一起，这一段不适合赶路，只适合慢慢走。听一会儿海，也给自己留一点空白。\n\n📍青岛 · 鲁迅公园 / 琴屿路\n🌊 海浪替旅行说了很多话。\n\n#琴屿路 #鲁迅公园 #青岛海边 #滨海漫步"}, {"day": 2, "time": "11:00–12:10", "name": "八大关", "tag": "林荫 · 老建筑 · 城市漫步", "nav": "八大关风景区 青岛", "shots": ["林荫大道全景", "经典建筑正面", "人物全身＋建筑", "人物半身＋树影", "背影走街道", "门窗／墙面细节", "过马路抓拍", "竖屏建筑人像", "横屏林荫大道", "最喜欢的街角"], "caption": "从海边走进八大关，城市突然安静下来。\n\n树影落在老建筑和街道上，每一条路都有自己的颜色。比起打卡某一栋房子，我更喜欢这里慢慢走过去的过程。\n\n📍青岛 · 八大关\n🏛️ 把时间留在有树影的老街里。\n\n#八大关 #青岛老建筑 #城市漫步 #青岛旅行"}, {"day": 2, "time": "12:10–12:40", "name": "第三海水浴场", "tag": "沙滩 · 海岸 · 短停", "nav": "第三海水浴场 青岛", "shots": ["沙滩全景", "海岸建筑群", "人物全身＋沙滩", "人物半身＋海", "背影看海", "沙纹／海浪细节", "沿海走路抓拍", "竖屏人物海景", "横屏海岸线", "坐着休息"], "caption": "八大关出来，就是海。\n\n第三海水浴场不需要停很久，坐一会儿、吹吹风，就够了。旅行不是每个地方都要安排得很满，有时候短暂停留反而刚好。\n\n📍青岛 · 第三海水浴场\n🏖️ 路过一片海，也算收藏了一段风景。\n\n#第三海水浴场 #青岛海边 #青岛旅行"}, {"day": 2, "time": "14:00–14:50", "name": "五四广场", "tag": "地标 · 城市 · 现代青岛", "nav": "五四广场 青岛", "shots": ["五月的风完整全景", "雕塑＋城市天际线", "人物全身＋地标", "人物半身", "背影＋雕塑", "雕塑局部细节", "广场行走抓拍", "竖屏地标人像", "横屏城市海景", "标准游客打卡照"], "caption": "从老城走到现代青岛。\n\n五月的风、城市天际线和海岸线，把青岛的另一面完整地展现出来。前一刻还是红瓦老街，下一刻已经是现代城市的海边。\n\n📍青岛 · 五四广场\n🔴 一座城市，两种完全不同的风景。\n\n#五四广场 #五月的风 #青岛地标 #城市风光"}, {"day": 2, "time": "15:00–16:30", "name": "奥帆中心 + 情人坝", "tag": "帆船 · 灯塔 · 旅程收官", "nav": "情人坝 青岛", "shots": ["帆船港全景", "情人坝／灯塔", "人物全身＋港湾", "人物半身＋帆船", "背影看海港", "帆船／灯塔细节", "沿坝走路抓拍", "竖屏灯塔人像", "横屏港湾天际线", "两天旅程收官合影"], "caption": "两天青岛的最后一站，留给奥帆中心和情人坝。\n\n帆船、灯塔、海风，还有慢慢变化的城市光线。一路从清晨的第一束光走到这里，这趟青岛旅行也刚好有了一个完整的结尾。\n\n📍青岛 · 奥帆中心 / 情人坝\n⛵ 山海有约，青岛再见。\n\n#奥帆中心 #情人坝 #青岛旅行 #旅行收官"}];
const KEY="qd_solo_data";
const LEGACY_KEYS=["qd_solo_progressive_v1","qd_team4_realtime_v1","qd_team4_v1"];
const PHOTO_DB_NAME="qingdao-photo-db"; const PHOTO_STORE="photos";
let st=loadState(), f=0, photoDBPromise=null, currentPosterName="青岛打卡图";
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function loadState(){let raw=localStorage.getItem(KEY); if(raw){try{return JSON.parse(raw)||{}}catch(e){}} for(const k of LEGACY_KEYS){const old=localStorage.getItem(k); if(!old) continue; try{const parsed=JSON.parse(old); let migrated=parsed; if(parsed&&Array.isArray(parsed.members)){const a=Number.isInteger(parsed.active)?parsed.active:0; migrated=parsed.members[a]||{};} localStorage.setItem(KEY,JSON.stringify(migrated||{})); return migrated||{};}catch(e){} } return {};}
function save(){localStorage.setItem(KEY,JSON.stringify(st)); progress();}
function nav(q){return 'https://uri.amap.com/search?keyword='+encodeURIComponent(q)+'&callnative=1'}
function openPhotoDB(){if(photoDBPromise) return photoDBPromise; photoDBPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(PHOTO_DB_NAME,1); req.onupgradeneeded=()=>{const db=req.result; if(!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE);}; req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);}); return photoDBPromise;}
function photoKey(i,j){return `spot-${i}-photo-${j}`;}
async function idbGet(key){const db=await openPhotoDB(); return new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,'readonly'); const req=tx.objectStore(PHOTO_STORE).get(key); req.onsuccess=()=>resolve(req.result||null); req.onerror=()=>reject(req.error);})}
async function idbSet(key,val){const db=await openPhotoDB(); return new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,'readwrite'); tx.objectStore(PHOTO_STORE).put(val,key); tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);})}
async function getSpotPhotos(i){const z=st[i]||{}; const shown=Math.max(1,Math.min(10,z.shown||1)); const out=[]; for(let j=0;j<shown;j++){const src=await idbGet(photoKey(i,j)); if(src) out.push(src);} return out;}
async function getSpotThumb(i,j){return await idbGet(photoKey(i,j));}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const fr=new FileReader(); fr.onload=()=>resolve(fr.result); fr.onerror=()=>reject(fr.error); fr.readAsDataURL(file);})}
async function compressImage(file,maxSide=1280,quality=0.82){const dataUrl=await fileToDataURL(file); const img=new Image(); await new Promise((resolve,reject)=>{img.onload=resolve; img.onerror=reject; img.src=dataUrl;}); let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height; const scale=Math.min(1,maxSide/Math.max(w,h)); const nw=Math.max(1,Math.round(w*scale)), nh=Math.max(1,Math.round(h*scale)); const canvas=document.createElement('canvas'); canvas.width=nw; canvas.height=nh; const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,nw,nh); return canvas.toDataURL('image/jpeg',quality);}
function setSlotImage(i,j,src){const el=document.getElementById(`p${i}-${j}`); if(!el) return; el.querySelector('img')?.remove(); if(!src){el.classList.remove('has'); return;} const im=document.createElement('img'); im.src=src; el.prepend(im); el.classList.add('has');}
async function hydrateSlot(i,j){const src=await idbGet(photoKey(i,j)); if(src) setSlotImage(i,j,src);}
async function hydrateVisiblePhotos(){const tasks=[]; Object.entries(st).forEach(([i,z])=>{const shown=Math.max(1,Math.min(10,(z&&z.shown)||1)); for(let j=0;j<shown;j++) tasks.push(hydrateSlot(Number(i),j));}); await Promise.all(tasks);}
function shortName(name){return name.split('/')[0].replace(/\s+/g,'').replace(/\+/g,'').trim();}
function titleName(name){return shortName(name).replace('西陵峡路','八大峡');}
function firstSentence(text){return String(text||'').split(/\n+/)[0].trim();}
function posterDesc(text){let arr=String(text||'').split(/\n+/).filter(Boolean).filter(x=>!x.startsWith('📍')&&!x.startsWith('#')&&!x.startsWith('🌅')&&!x.startsWith('⛰️')&&!x.startsWith('🏘️')&&!x.startsWith('⛵')&&!x.startsWith('💙')&&!x.startsWith('🌿')&&!x.startsWith('🏙️')&&!x.startsWith('🐟')&&!x.startsWith('🌊')&&!x.startsWith('🏛️')&&!x.startsWith('🏖️')&&!x.startsWith('🔴')); return (arr[1]||arr[0]||'').trim();}
function getTheme(stop){const n=stop.name; if(/八大峡|西陵峡|日出/.test(n)) return {cls:'theme-dawn', sub:'海边日出，今天的第一束光', deco:'sun ship'}; if(/八大关/.test(n)) return {cls:'theme-leaf', sub:'一街一景，步步皆是浪漫', deco:'leaf camera'}; if(/信号山|小鱼山/.test(n)) return {cls:'theme-sky', sub:'登高望远，俯瞰红瓦碧海', deco:'skyline camera'}; if(/鲁迅公园|海之恋|第三海水浴场/.test(n)) return {cls:'theme-rock', sub:'海风与礁石，文艺与烟火', deco:'book ship'}; if(/琴屿路/.test(n)) return {cls:'theme-flower', sub:'面朝大海，一路浪漫', deco:'flower camera'}; if(/小麦岛/.test(n)) return {cls:'theme-sunset', sub:'落日余晖，治愈一切疲惫', deco:'sun camera'}; if(/流清河|东麦窑|沙子口|崂山/.test(n)) return {cls:'theme-mountain', sub:'山海相连，遇见不一样的青岛', deco:'mountain camera'}; if(/五四广场|奥帆中心|情人坝/.test(n)) return {cls:'theme-city', sub:'城市与海风，把回忆留在这里', deco:'sun lighthouse'}; return {cls:'theme-city', sub:'把风景留在今天的打卡里', deco:'camera'};}
function effectiveCaption(i){return (st[i]&&typeof st[i].captionCustom==="string"&&st[i].captionCustom.trim())?st[i].captionCustom:S[i].caption;}
function editCaption(i,v){st[i]=st[i]||{};st[i].captionCustom=v;save();}
function restoreCaption(i){st[i]=st[i]||{};delete st[i].captionCustom;save();const el=document.getElementById("capedit"+i);if(el)el.value=S[i].caption;toast("已恢复默认文案");}
function progress(){let n=S.filter((_,i)=>st[i]?.done).length; document.getElementById('prog').textContent=n+' / '+S.length; document.getElementById('bar').style.width=(n/S.length*100)+'%';}
function render(){const list=document.getElementById('list'); list.innerHTML=''; [1,2].forEach(d=>{const a=S.map((x,i)=>({...x,i})).filter(x=>x.day===d&&(!f||f===d)); if(!a.length) return; list.insertAdjacentHTML('beforeend',`<div class="day">DAY ${d} · ${d===1?'日出＋免费崂山海岸线':'老城＋经典海岸线'}</div>`); a.forEach(x=>list.appendChild(card(x))); }); progress(); requestAnimationFrame(hydrateVisiblePhotos);}
function slotMarkup(i,j,z){let done=!!(z.ps&&z.ps[j]); return `<label class="slot ${done?'has':''}" id="p${i}-${j}"><span class="num">照片 ${j+1}</span><input type="file" accept="image/*" onchange="photo(event,${i},${j})"><span class="prompt">${esc(S[i].shots[j])}</span></label>`;}
function card(x){let z=st[x.i]||{}, c=document.createElement('section'); c.className='card'; c.id='s'+x.i; let shown=Math.max(1,Math.min(10,z.shown||1)); let slots=Array.from({length:shown},(_,j)=>slotMarkup(x.i,j,z)).join(''); let canAdd=shown<10&&!!(z.ps&&z.ps[shown-1]); c.innerHTML=`<div class="top"><div><div class="time">${x.time}</div><h2>${esc(x.name)}</h2><div class="tag">${esc(x.tag)}</div></div><span id="status${x.i}" class="status ${z.arrived?'ok':''}">${z.arrived?'已到达':'未到达'}</span></div><div class="actions"><a class="btn nav" href="${nav(x.nav)}">🧭 导航到这里</a><button class="btn arr" onclick="arrive(${x.i})">📍 ${z.arrived?'已到达':'到达打卡'}</button></div><div class="shothead"><span>📷 我的照片</span><span class="count" id="cnt${x.i}">${z.n||0}/10</span></div><div class="grid" id="grid${x.i}">${slots}</div><button class="addphoto" id="add${x.i}" onclick="addPhotoSlot(${x.i})" ${canAdd?'':'hidden'}>＋ 添加下一张</button><div class="ex-row"><button class="expbtn outline" onclick="exportSpot(${x.i})">🖼 导出本景点打卡图</button><button class="expbtn sand" onclick="copyCap(${x.i})">复制打卡文案</button></div><div class="copybox"><div class="ct">✨ 打卡文案（可修改）</div><textarea id="capedit${x.i}" class="capedit" oninput="editCaption(${x.i},this.value)">${esc(effectiveCaption(x.i))}</textarea><div class="captools"><button class="restorecap" onclick="restoreCaption(${x.i})">恢复默认文案</button><button class="copycap" onclick="copyCap(${x.i})">复制当前文案</button></div></div><textarea class="note" placeholder="写一句你自己的现场感受……" onchange="note(${x.i},this.value)">${esc(z.note||'')}</textarea><button class="donebtn ${z.done?'on':''}" onclick="done(${x.i})">${z.done?'✓ 本站已完成':'完成这一站 ✓'}</button>`; return c;}
function arrive(i){st[i]=st[i]||{}; st[i].arrived=true; save(); document.getElementById('status'+i).className='status ok'; document.getElementById('status'+i).textContent='已到达'; toast('到达打卡成功');}
async function photo(e,i,j){let file=e.target.files&&e.target.files[0]; if(!file) return; const src=await compressImage(file); await idbSet(photoKey(i,j),src); setSlotImage(i,j,src); st[i]=st[i]||{}; st[i].ps=st[i].ps||{}; st[i].ps[j]=1; st[i].shown=Math.max(st[i].shown||1,j+1); st[i].n=Object.keys(st[i].ps).filter(k=>st[i].ps[k]).length; save(); document.getElementById('cnt'+i).textContent=st[i].n+'/10'; let add=document.getElementById('add'+i); if(add) add.hidden=!(st[i].shown<10&&st[i].ps[st[i].shown-1]); toast(`照片 ${j+1} 已保存并展示`);}
function addPhotoSlot(i){st[i]=st[i]||{}; let shown=Math.max(1,Math.min(10,st[i].shown||1)); if(shown>=10) return toast('最多添加10张照片'); if(!(st[i].ps&&st[i].ps[shown-1])) return toast('请先上传当前这张照片'); let j=shown; st[i].shown=shown+1; save(); let grid=document.getElementById('grid'+i); let wrap=document.createElement('div'); wrap.innerHTML=slotMarkup(i,j,st[i]); grid.appendChild(wrap.firstElementChild); let add=document.getElementById('add'+i); if(add) add.hidden=true; setTimeout(()=>document.getElementById(`p${i}-${j}`)?.scrollIntoView({behavior:'smooth',block:'center'}),30);}
function note(i,v){st[i]=st[i]||{}; st[i].note=v; save();}
async function done(i){st[i]=st[i]||{}; st[i].done=!st[i].done; save(); render(); await hydrateVisiblePhotos(); requestAnimationFrame(()=>{hydrateVisiblePhotos(); document.getElementById('s'+i)?.scrollIntoView({block:'center'});}); toast(st[i].done?'本站已完成，照片已保留展示':'已取消完成状态');}
async function copyCap(i){const txt=effectiveCaption(i);try{await navigator.clipboard.writeText(txt)}catch(e){let t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();} toast('当前文案已复制');}
function filterDay(d,b){f=d; document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); render();}
function nextStop(){let i=S.findIndex((_,k)=>!st[k]?.done); if(i<0) return toast('13站全部完成 🎉'); if(f&&S[i].day!==f){f=0; document.querySelectorAll('.tabs button').forEach((b,k)=>b.classList.toggle('on',k===0)); render();} setTimeout(()=>document.getElementById('s'+i)?.scrollIntoView({behavior:'smooth',block:'start'}),30);}
function scrollToFirstUnfinished(){nextStop();}
function resetAll(){if(confirm('确定重置打卡进度、备注和已保存照片？')){st={}; localStorage.removeItem(KEY); indexedDB.deleteDatabase(PHOTO_DB_NAME); photoDBPromise=null; render(); toast('已重置');}}
function toast(s){let e=document.getElementById('toast'); e.textContent=s; e.classList.add('show'); clearTimeout(window._toastTimer); window._toastTimer=setTimeout(()=>e.classList.remove('show'),1700);}
function locationText(stop){return `📍 青岛 · ${stop.name}`;}
function renderPosterPhotos(photos){if(!photos.length) return `<div class="photo-hero"><div style="height:270px;display:flex;align-items:center;justify-content:center;color:#6b7f8f;font-weight:800">暂无照片</div></div>`; let hero=`<div class="photo-hero"><img src="${photos[0]}"></div>`; if(photos.length===1) return hero; let thumbs=photos.slice(1,4).map((src,idx)=>{let more=''; if(idx===2 && photos.length>4) more=` more" data-more="+${photos.length-4}`; return `<div class="thumb${more}"><img src="${src}"></div>`;}).join(''); return hero+`<div class="thumbs">${thumbs}</div>`;}
function decorate(theme){let d=''; if(theme.deco.includes('sun')) d+='<div class="sun-doodle">☀️</div>'; if(theme.deco.includes('ship')) d+='<div class="ship-doodle">⛵</div>'; if(theme.deco.includes('camera')) d+='<div class="camera-doodle">📷</div>'; if(theme.deco.includes('book')) d+='<div class="book-doodle">📖</div>'; if(theme.deco.includes('flower')) d+='<div class="flower-doodle">🌸</div>'; if(theme.deco.includes('mountain')) d+='<div class="mountain-doodle">⛰️</div>'; if(theme.deco.includes('lighthouse')) d+='<div class="lighthouse-doodle">🗼</div>'; if(theme.deco.includes('skyline')) d+='<div class="skyline">🏙️</div>'; return d;}
async function exportSpot(i){const stop=S[i]; const photos=await getSpotPhotos(i); if(!photos.length){toast('先上传至少1张照片再导出'); return;} const theme=getTheme(stop); const count=photos.length; const poster=`<div class="poster ${theme.cls} ${theme.cls==='theme-leaf'?'leaf-corner':''} ${theme.cls==='theme-flower'?'floral-corner':''}"><div class="mountain-bg" style="display:${theme.cls==='theme-mountain'?'block':'none'}"></div><div class="wave" style="display:${/theme-dawn|theme-rock|theme-summary/.test(theme.cls)?'block':'none'}"></div>${decorate(theme)}<div class="badge">${count}张照片</div><div class="sheet"><div><span class="title-cn">青岛·${esc(titleName(stop.name))}</span>${theme.cls==='theme-dawn'?'<span class="title-en">Qingdao</span>':''}</div><div class="sub">${esc(theme.sub)}</div><div class="loc">${esc(locationText(stop))}</div>${renderPosterPhotos(photos)}<div class="desc">${esc(posterDesc(effectiveCaption(i))||firstSentence(effectiveCaption(i))||'把这一站的海风与风景，留在今天的打卡里。')}</div></div></div>`; openExportModal(`${titleName(stop.name)} 打卡图`, poster, `${titleName(stop.name)}_打卡图`);}
async function exportOverall(){let items=[]; for(let i=0;i<S.length;i++){const thumb=await getSpotThumb(i,0); if(thumb) items.push({name:titleName(S[i].name), src:thumb});} if(!items.length){toast('先上传一些照片再导出整体打卡图'); return;} const visited=S.filter((_,i)=>st[i]?.done||st[i]?.n>0).length; const cards=items.slice(0,8).map((it,idx)=>`<div class="polaroid" style="--r:${['-4deg','2deg','-2deg','3deg','-3deg','1deg','-1deg','2deg'][idx%8]}"><img src="${it.src}"><div class="plabel">${esc(it.name)}</div></div>`).join(''); const today=new Date(); const ds=`${today.getFullYear()}.${today.getMonth()+1}.${today.getDate()}`; const poster=`<div class="poster theme-summary"><div class="wave"></div><div class="mountain-bg"></div><div class="sun-doodle">☀️</div><div class="lighthouse-doodle">🗼</div><div class="date">${ds}</div><div class="sheet"><div style="display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap"><div class="title-cn">青岛<br>旅行打卡册</div><div class="title-en">Qingdao Trip</div></div><div class="sub">山海相遇，不负美好时光！</div><div class="polaroid-grid">${cards}</div><div class="summary-text">在青岛的这几站里，海风、日出、山海、街景，都被一张张照片认真收藏。<br>已记录 <b>${visited}</b> 个景点，期待下一次，再见青岛。</div></div></div>`; openExportModal('整体打卡图', poster, '青岛旅行整体打卡图');}
function openExportModal(title, posterHTML, fileName){currentPosterName=fileName; document.getElementById('modalTitle').textContent=title; document.getElementById('posterPreview').innerHTML=posterHTML; document.getElementById('exportModal').classList.add('show');}
function closeExportModal(){document.getElementById('exportModal').classList.remove('show');}
async function downloadPoster(){const node=document.getElementById('posterPreview').firstElementChild; if(!node) return; if(typeof html2canvas==='undefined'){toast('导出组件加载中，请稍后再试'); return;} const canvas=await html2canvas(node,{scale:2,useCORS:true,backgroundColor:null}); const a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download=(currentPosterName||'打卡图')+'.png'; a.click(); toast('导出成功');}
render();
</script>
</body>
</html>

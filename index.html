<script>
const S=[{"day": 1, "time": "05:20–06:10", "name": "八大峡 / 西陵峡路", "tag": "日出 · 第一站", "nav": "八大峡广场 青岛", "shots": ["海面日出大远景", "太阳刚露出海面的瞬间", "人物全身＋日出", "人物半身侧脸＋晨光", "背影看海", "海浪／礁石细节", "沿海边走路抓拍", "竖屏人物＋太阳", "横屏海岸全景", "离开前合影"], "caption": "青岛的第一站，从一场海边日出开始。\n\n天还没有完全亮，海风先到了。看着天色从蓝灰一点点染成橙红，太阳从海面升起，旅行也在这一刻正式开始。\n\n📍青岛 · 八大峡 / 西陵峡路\n🌅 把今天的第一束光，留在海边。\n\n#青岛旅行 #青岛日出 #八大峡 #西陵峡路"}, {"day": 1, "time": "08:30–09:45", "name": "流清河沙滩", "tag": "免费崂山 · 山海同框", "nav": "流清河沙滩 青岛", "shots": ["山＋海大远景", "沙滩完整环境", "人物全身＋山海", "人物半身＋海风", "背影走向海边", "海浪／沙纹细节", "踩水抓拍", "竖屏山海人物", "横屏海岸大片", "山海合影"], "caption": "不爬崂山，也能看见崂山最舒服的一面。\n\n山就在身后，海就在眼前。没有赶路，也没有打卡式登山，只是在流清河的沙滩上慢慢走，把山、海和风一起装进照片里。\n\n📍青岛 · 流清河沙滩\n⛰️ 山海相逢，自有答案。\n\n#崂山 #流清河 #青岛海边 #山海之间"}, {"day": 1, "time": "09:45–10:45", "name": "东麦窑", "tag": "渔村 · 红瓦 · 山脚", "nav": "东麦窑社区 青岛", "shots": ["村落＋山体全景", "红瓦房屋特写", "人物全身＋村路", "人物半身＋老屋", "背影走进村里", "石墙／门牌细节", "街巷自然抓拍", "竖屏红瓦层次", "横屏村落＋海", "生活感小角落"], "caption": "从海滩走进崂山脚下的小渔村。\n\n红瓦、石墙、老屋和远处的山海都挤进一幅画里。这里没有热门景点的喧闹，更像是偶然走进了青岛安静的日常。\n\n📍青岛 · 东麦窑\n🏘️ 山脚有村，村外有海。\n\n#东麦窑 #崂山渔村 #青岛旅行 #山海渔村"}, {"day": 1, "time": "11:20–12:30", "name": "沙子口", "tag": "海湾 · 渔船 · 午间", "nav": "沙子口 青岛", "shots": ["海湾全景", "渔船／港湾", "人物全身＋海湾", "人物半身", "背影看海", "船只／码头细节", "沿岸走路抓拍", "竖屏港湾", "横屏海湾", "午饭／本地小吃"], "caption": "上午的山海路线，在沙子口慢下来。\n\n海湾、渔船和岸边的生活气息，让这里不像一个必须完成的景点，更像一段刚刚好的停顿。看一会儿海，再认真吃顿午饭。\n\n📍青岛 · 沙子口\n⛵ 海风经过，时间也慢一点。\n\n#沙子口 #青岛海湾 #青岛旅行 #慢旅行"}, {"day": 1, "time": "13:40–14:20", "name": "海之恋公园", "tag": "海岸公园 · 轻松散步", "nav": "海之恋公园 青岛", "shots": ["公园海岸大景", "标志景观", "人物全身＋海岸", "人物半身", "背影看海", "栏杆／植物细节", "散步抓拍", "竖屏海边人像", "横屏海景", "坐着休息"], "caption": "下午不赶路，只在海边慢慢走。\n\n旅行里最舒服的时刻，往往不是完成了多少景点，而是刚好有一段时间，可以吹风、看海、什么都不用想。\n\n📍青岛 · 海之恋公园\n💙 把下午留给海风。\n\n#海之恋公园 #青岛海边 #松弛感"}, {"day": 1, "time": "14:40–16:40", "name": "小麦岛", "tag": "草地 · 海景 · 第一日收尾", "nav": "小麦岛公园 青岛", "shots": ["小麦岛海岸全景", "草地＋海", "人物全身＋草地", "人物半身＋海风", "背影坐草地", "海浪／礁石", "沿海步道抓拍", "竖屏人物海景", "横屏岛屿海岸", "当天最喜欢的一张"], "caption": "第一天最后一站，留给小麦岛。\n\n坐在草地上吹风，看海面一点点变柔，不再赶时间，也不用刻意安排什么。青岛的浪漫，大概就是把一天结束在这样松弛的海边。\n\n📍青岛 · 小麦岛\n🌿 今日份浪漫，到海边刚刚好。\n\n#小麦岛 #青岛旅行 #海边草地 #松弛旅行"}, {"day": 2, "time": "08:00–08:45", "name": "信号山", "tag": "红瓦 · 绿树 · 老城全景", "nav": "信号山公园 青岛", "shots": ["老城＋海全景", "红瓦屋顶层次", "人物全身＋城市", "人物半身＋栏杆", "背影俯瞰老城", "观景台细节", "上山抓拍", "竖屏红瓦人像", "横屏城市全景", "最高处纪念照"], "caption": "第二天，从老城的高处开始。\n\n红瓦、绿树、老建筑和远处的海，在信号山上一层层铺开。站在这里，才真正明白为什么青岛的颜色这么特别。\n\n📍青岛 · 信号山\n🏙️ 一眼看见青岛的红瓦与海。\n\n#信号山 #青岛老城 #红瓦绿树 #青岛旅行"}, {"day": 2, "time": "08:50–09:30", "name": "小鱼山", "tag": "老城 · 海岸 · 另一种视角", "nav": "小鱼山公园 青岛", "shots": ["观景台全景", "老城＋海同框", "人物全身＋景色", "人物半身", "背影观景", "亭台建筑细节", "观景台抓拍", "竖屏城市层次", "横屏老城海岸", "特色建筑合影"], "caption": "换一个角度，再看一次青岛老城。\n\n小鱼山不高，却刚好能把屋顶、树影、海岸和城市一起收进眼里。比起宏大的风景，这里更像一张精致的青岛明信片。\n\n📍青岛 · 小鱼山\n🐟 山不高，风景刚刚好。\n\n#小鱼山 #青岛老城 #青岛旅行 #城市风景"}, {"day": 2, "time": "09:35–10:50", "name": "鲁迅公园 + 琴屿路", "tag": "礁石 · 海浪 · 滨海步行", "nav": "琴屿路 青岛", "shots": ["礁石海岸大景", "琴屿路路牌／街景", "人物全身＋海", "人物半身＋树影", "背影沿海走", "海浪拍礁石", "走路自然抓拍", "竖屏街海构图", "横屏海岸大片", "咖啡／休息"], "caption": "沿着鲁迅公园走到琴屿路，海一直在身边。\n\n礁石、树影、海浪和老城气息混在一起，这一段不适合赶路，只适合慢慢走。听一会儿海，也给自己留一点空白。\n\n📍青岛 · 鲁迅公园 / 琴屿路\n🌊 海浪替旅行说了很多话。\n\n#琴屿路 #鲁迅公园 #青岛海边 #滨海漫步"}, {"day": 2, "time": "11:00–12:10", "name": "八大关", "tag": "林荫 · 老建筑 · 城市漫步", "nav": "八大关风景区 青岛", "shots": ["林荫大道全景", "经典建筑正面", "人物全身＋建筑", "人物半身＋树影", "背影走街道", "门窗／墙面细节", "过马路抓拍", "竖屏建筑人像", "横屏林荫大道", "最喜欢的街角"], "caption": "从海边走进八大关，城市突然安静下来。\n\n树影落在老建筑和街道上，每一条路都有自己的颜色。比起打卡某一栋房子，我更喜欢这里慢慢走过去的过程。\n\n📍青岛 · 八大关\n🏛️ 把时间留在有树影的老街里。\n\n#八大关 #青岛老建筑 #城市漫步 #青岛旅行"}, {"day": 2, "time": "12:10–12:40", "name": "第三海水浴场", "tag": "沙滩 · 海岸 · 短停", "nav": "第三海水浴场 青岛", "shots": ["沙滩全景", "海岸建筑群", "人物全身＋沙滩", "人物半身＋海", "背影看海", "沙纹／海浪细节", "沿海走路抓拍", "竖屏人物海景", "横屏海岸线", "坐着休息"], "caption": "八大关出来，就是海。\n\n第三海水浴场不需要停很久，坐一会儿、吹吹风，就够了。旅行不是每个地方都要安排得很满，有时候短暂停留反而刚好。\n\n📍青岛 · 第三海水浴场\n🏖️ 路过一片海，也算收藏了一段风景。\n\n#第三海水浴场 #青岛海边 #青岛旅行"}, {"day": 2, "time": "14:00–14:50", "name": "五四广场", "tag": "地标 · 城市 · 现代青岛", "nav": "五四广场 青岛", "shots": ["五月的风完整全景", "雕塑＋城市天际线", "人物全身＋地标", "人物半身", "背影＋雕塑", "雕塑局部细节", "广场行走抓拍", "竖屏地标人像", "横屏城市海景", "标准游客打卡照"], "caption": "从老城走到现代青岛。\n\n五月的风、城市天际线和海岸线，把青岛的另一面完整地展现出来。前一刻还是红瓦老街，下一刻已经是现代城市的海边。\n\n📍青岛 · 五四广场\n🔴 一座城市，两种完全不同的风景。\n\n#五四广场 #五月的风 #青岛地标 #城市风光"}, {"day": 2, "time": "15:00–16:30", "name": "奥帆中心 + 情人坝", "tag": "帆船 · 灯塔 · 旅程收官", "nav": "情人坝 青岛", "shots": ["帆船港全景", "情人坝／灯塔", "人物全身＋港湾", "人物半身＋帆船", "背影看海港", "帆船／灯塔细节", "沿坝走路抓拍", "竖屏灯塔人像", "横屏港湾天际线", "两天旅程收官合影"], "caption": "两天青岛的最后一站，留给奥帆中心和情人坝。\n\n帆船、灯塔、海风，还有慢慢变化的城市光线。一路从清晨的第一束光走到这里，这趟青岛旅行也刚好有了一个完整的结尾。\n\n📍青岛 · 奥帆中心 / 情人坝\n⛵ 山海有约，青岛再见。\n\n#奥帆中心 #情人坝 #青岛旅行 #旅行收官"}],KEY="qd_solo_data";
const LEGACY_KEYS=["qd_solo_progressive_v1","qd_team4_realtime_v1","qd_team4_v1"];
function loadState(){
  let raw=localStorage.getItem(KEY);
  if(raw){try{return JSON.parse(raw)||{}}catch(e){}}
  for(const k of LEGACY_KEYS){
    const old=localStorage.getItem(k);
    if(!old) continue;
    try{
      const parsed=JSON.parse(old);
      // 单人旧版可直接迁移；多人旧版仅迁移当前成员的数据，避免误覆盖
      let migrated=parsed;
      if(parsed&&Array.isArray(parsed.members)){
        const a=Number.isInteger(parsed.active)?parsed.active:0;
        migrated=parsed.members[a]||{};
      }
      localStorage.setItem(KEY,JSON.stringify(migrated||{}));
      return migrated||{};
    }catch(e){}
  }
  return {};
}
let st=loadState(),f=0;
const esc=s=>s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const nav=q=>"https://uri.amap.com/search?keyword="+encodeURIComponent(q)+"&callnative=1";
function save(){localStorage.setItem(KEY,JSON.stringify(st));progress()}
function render(){let L=document.getElementById("list");L.innerHTML="";[1,2].forEach(d=>{let a=S.map((x,i)=>({...x,i})).filter(x=>x.day===d&&(!f||f===d));if(!a.length)return;L.insertAdjacentHTML("beforeend",`<div class="day">DAY ${d} · ${d===1?"日出＋免费崂山海岸":"老城＋经典海岸"}</div>`);a.forEach(x=>L.appendChild(card(x)))});progress()}
function slotMarkup(i,j,z){
 let done=!!(z.ps&&z.ps[j]);
 return `<label class="slot ${done?"has":""}" id="p${i}-${j}"><span class="num">照片 ${j+1}</span><input type="file" accept="image/*" onchange="photo(event,${i},${j})">${done?'<span class="savedmark">✓</span>':''}<span class="prompt">${esc(S[i].shots[j])}</span></label>`
}
function card(x){
 let z=st[x.i]||{},c=document.createElement("section");c.className="card"+(z.done?" done":"");c.id="s"+x.i;
 let shown=Math.max(1,Math.min(10,z.shown||1));
 let slots=Array.from({length:shown},(_,j)=>slotMarkup(x.i,j,z)).join("");
 let canAdd=shown<10&&!!(z.ps&&z.ps[shown-1]);
 c.innerHTML=`<div class="top"><div><div class="time">${x.time}</div><h2>${esc(x.name)}</h2><div class="tag">${esc(x.tag)}</div></div><span id="status${x.i}" class="status ${z.arrived?"ok":""}">${z.arrived?"已到达":"未到达"}</span></div><div class="actions"><a class="btn nav" href="${nav(x.nav)}">🧭 导航到这里</a><button class="btn arr" onclick="arrive(${x.i})">📍 ${z.arrived?"已到达":"到达打卡"}</button></div><div class="shothead"><span>📷 我的照片</span><span class="count" id="cnt${x.i}">${z.n||0}/10</span></div><div class="grid" id="grid${x.i}">${slots}</div><button class="addphoto" id="add${x.i}" onclick="addPhotoSlot(${x.i})" ${canAdd?'':'hidden'}>＋ 添加下一张</button><div class="copybox"><div class="ct">✨ 推荐打卡文案</div><div class="cap">${esc(x.caption)}</div><button class="copy" onclick="copyCap(${x.i})">复制文案</button></div><textarea class="note" placeholder="写一句你自己的现场感受……" onchange="note(${x.i},this.value)">${esc(z.note||"")}</textarea><button class="donebtn ${z.done?"on":""}" onclick="done(${x.i})">${z.done?"✓ 本站已完成":"完成这一站 ✓"}</button>`;return c
}
function arrive(i){st[i]=st[i]||{};st[i].arrived=true;save();document.getElementById("status"+i).className="status ok";document.getElementById("status"+i).textContent="已到达";toast("到达打卡成功")}
function photo(e,i,j){
 let file=e.target.files&&e.target.files[0];if(!file)return;
 let el=document.getElementById(`p${i}-${j}`);el.querySelector("img")?.remove();el.querySelector(".savedmark")?.remove();
 let im=document.createElement("img");im.src=URL.createObjectURL(file);el.prepend(im);el.classList.add("has");
 st[i]=st[i]||{};st[i].ps=st[i].ps||{};st[i].ps[j]=1;st[i].shown=Math.max(st[i].shown||1,j+1);st[i].n=Object.keys(st[i].ps).filter(k=>st[i].ps[k]).length;save();
 document.getElementById("cnt"+i).textContent=st[i].n+"/10";
 let add=document.getElementById("add"+i);if(add)add.hidden=!(st[i].shown<10&&st[i].ps[st[i].shown-1]);
 toast(`照片 ${j+1} 已选，点＋可继续添加`)
}
function addPhotoSlot(i){
 st[i]=st[i]||{};let shown=Math.max(1,Math.min(10,st[i].shown||1));
 if(shown>=10)return toast("最多添加10张照片");
 if(!(st[i].ps&&st[i].ps[shown-1]))return toast("请先上传当前这张照片");
 let j=shown;st[i].shown=shown+1;save();
 let grid=document.getElementById("grid"+i);let wrap=document.createElement("div");wrap.innerHTML=slotMarkup(i,j,st[i]);grid.appendChild(wrap.firstElementChild);
 let add=document.getElementById("add"+i);if(add)add.hidden=true;
 setTimeout(()=>document.getElementById(`p${i}-${j}`)?.scrollIntoView({behavior:"smooth",block:"center"}),30)
}
function note(i,v){st[i]=st[i]||{};st[i].note=v;save()}
function done(i){st[i]=st[i]||{};st[i].done=!st[i].done;save();render();setTimeout(()=>document.getElementById("s"+i)?.scrollIntoView({block:"center"}),20)}
async function copyCap(i){try{await navigator.clipboard.writeText(S[i].caption)}catch(e){let t=document.createElement("textarea");t.value=S[i].caption;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}toast("文案已复制")}
function filter(d,b){f=d;document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");render()}
function progress(){let n=S.filter((_,i)=>st[i]?.done).length;document.getElementById("prog").textContent=n+" / "+S.length;document.getElementById("bar").style.width=(n/S.length*100)+"%"}
function nextStop(){let i=S.findIndex((_,k)=>!st[k]?.done);if(i<0)return toast("13站全部完成 🎉");if(f&&S[i].day!==f){f=0;document.querySelectorAll(".tabs button").forEach((b,k)=>b.classList.toggle("on",k===0));render()}setTimeout(()=>document.getElementById("s"+i)?.scrollIntoView({behavior:"smooth",block:"start"}),30)}
function resetAll(){if(confirm("确定重置打卡进度和备注？")){st={};localStorage.removeItem(KEY);render();toast("已重置")}}
let tt;function toast(s){let e=document.getElementById("toast");e.textContent=s;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),1500)}
render();
</script></body></html>
